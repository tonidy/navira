name: navira

# WordPress + MySQL for navira.run.biz.id.
#
# This file mirrors the deployed stack at /opt/stacks/navira/compose.yaml.
# Keep the two in sync and diff them before changing either one.
#
# WordPress runs as php-fpm and does not serve HTTP itself. The host nginx
# vhost (/etc/nginx/conf.d/navira.run.biz.id.conf) terminates TLS and
# speaks FastCGI to 127.0.0.1:9000. nginx also has to read the same files for
# its own "index" and "try_files" handling, which is why the webroot is a host
# bind mount and not a named volume: /var/lib/docker is mode 0710 root:root, so
# nginx's www-data user cannot traverse into a named volume and every request
# turns into a site-wide 404.
#
# Secrets come from .env, which is deliberately not in this repo. See fnox.toml.

services:
  db:
    image: mysql:8
    command: ["--max-connections=40", "--table-open-cache=512", "--performance-schema=OFF"]
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 768m

  wordpress:
    image: wordpress:7.1.4-php8.5-fpm
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      # FastCGI, bound to loopback. The host nginx connects here.
      - "127.0.0.1:9000:9000"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
      # wp_mail has no sendmail binary in this image; nvr-smtp.php routes
      # it to Mailpit over the compose network instead.
      NVR_SMTP_HOST: mailpit
      NVR_SMTP_PORT: "1025"
      NVR_MAIL_FROM: no-reply@navira.run.biz.id
      NVR_MAIL_NAME: Navira Beauty
      # Only applied when wp-config.php is generated, i.e. on a fresh
      # volume. The live file was edited in place; see
      # deploy/navira-wp-cron for why.
      WORDPRESS_CONFIG_EXTRA: |
        if ( ! defined( 'DISABLE_WP_CRON' ) ) { define( 'DISABLE_WP_CRON', true ); }
    volumes:
      # Shared with nginx, see the note at the top of this file.
      - /srv/navira/wp:/var/www/html
      - ./php-fpm-limits.conf:/usr/local/etc/php-fpm.d/zz-resource-limits.conf:ro
      # wp-cli, parked on the host so it survives container recreates.
      - /srv/navira/bin/wp:/usr/local/bin/wp:ro
    mem_limit: 512m

  mailpit:
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    ports:
      # Web inbox on loopback only. Reach it with an SSH tunnel:
      #   ssh -N -L 8025:127.0.0.1:8025 root@node8
      # SMTP (1025) is not published; only the compose network needs it.
      - "127.0.0.1:8025:8025"
    environment:
      # Keep the catch-all honest: accept anything, store a bounded amount.
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    volumes:
      - mailpit_data:/data
    mem_limit: 128m

volumes:
  mysql_data:
    external: true
    name: sh0-wp-portofolio-db-data
  # The pre-bind-mount webroot. Not mounted any more, kept so the old copy of
  # the files stays reachable if the bind mount needs rolling back.
  wordpress_data:
    external: true
    name: sh0-wp-portofolio-wp-data
  mailpit_data:
